<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rocket Training 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}#game{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}#title{position:absolute;top:12px;left:14px;font-size:20px;font-weight:700;text-shadow:0 2px 4px #000}#status{position:absolute;top:42px;left:14px;font-size:14px;text-shadow:0 2px 4px #000}#score{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:800;background:#0008;padding:7px 18px;border-radius:14px;text-shadow:0 2px 4px #000}.teamR{color:#ff5757}.teamG{color:#64e77b}#controls{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.stick{width:112px;height:112px;border-radius:50%;background:#0008;border:1px solid #ffffff55;pointer-events:auto;position:relative;touch-action:none}.knob{width:52px;height:52px;border-radius:50%;background:#ffffff55;border:1px solid #fff8;position:absolute;left:30px;top:30px}.jump{width:82px;height:82px;border-radius:50%;background:#0009;color:#fff;border:1px solid #ffffff66;font-size:15px;font-weight:800;pointer-events:auto;touch-action:none}.reset{width:70px;height:42px;border-radius:12px;background:#0008;color:#fff;border:1px solid #ffffff55;font-size:12px;font-weight:700;pointer-events:auto;touch-action:none;margin-left:8px}@media(min-width:700px){.stick{width:130px;height:130px}.knob{left:38px;top:38px}.jump{width:92px;height:92px}}
</style></head>
<body>
<canvas id="game"></canvas><div id="ui"><div id="title">ROCKET TRAINING 3D</div><div id="status">Training — بلا وقت</div><div id="score"><span class="teamR">0</span> : <span class="teamG">0</span></div><div id="controls"><div id="stick" class="stick" aria-label="Analog control"><div id="knob" class="knob"></div></div><div><button id="jump" class="jump">JUMP</button><button id="reset" class="reset">RESET</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82b6df);scene.fog=new THREE.Fog(0x82b6df,45,110);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);scene.add(new THREE.HemisphereLight(0xffffff,0x24452e,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(15,30,10);sun.castShadow=true;scene.add(sun);
// Large Rocket-League-style pitch: red half + green half.
const red=new THREE.Mesh(new THREE.BoxGeometry(44,.35,14),new THREE.MeshStandardMaterial({color:0xc93232,roughness:.9}));red.position.set(0,-.18,-7);red.receiveShadow=true;scene.add(red);
const green=new THREE.Mesh(new THREE.BoxGeometry(44,.35,14),new THREE.MeshStandardMaterial({color:0x2d8a45,roughness:.9}));green.position.set(0,-.18,7);green.receiveShadow=true;scene.add(green);
const lineMat=new THREE.MeshBasicMaterial({color:0xffffff});function line(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.035,d),lineMat);m.position.set(x,.01,z);scene.add(m)}line(0,0,.14,28);line(0,0,44,.14);line(-22,0,.12,28);line(22,0,.12,28);line(0,-14,44,.12);line(0,14,44,.12);
const circle=new THREE.Mesh(new THREE.RingGeometry(3.7,3.85,64),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));circle.rotation.x=-Math.PI/2;circle.position.y=.025;scene.add(circle);
function goal(z,rot,color){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.18});for(const x of[-5,5]){const p=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,5.4),mat);p.position.set(x,1.7,0);g.add(p)}const bar=new THREE.Mesh(new THREE.BoxGeometry(10,.35,.35),mat);bar.position.y=3.4;g.add(bar);g.rotation.y=rot;g.position.z=z;scene.add(g)}goal(-14,0,0xff3030);goal(14,Math.PI,0x49ef69);
// Simple green classic mini car, inspired by a Mr Bean-style retro car.
const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.25,.7,3.5),new THREE.MeshStandardMaterial({color:0x9eb51f,roughness:.55}));body.position.y=.65;body.castShadow=true;car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.8,1.65),new THREE.MeshStandardMaterial({color:0x17252b,roughness:.3,transparent:true,opacity:.9}));cabin.position.set(0,1.18,-.15);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.65,.12,1.75),new THREE.MeshStandardMaterial({color:0x6f7f18}));roof.position.set(0,1.62,-.15);car.add(roof);
for(const x of[-1.18,1.18])for(const z of[-1.12,1.12]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.28,20),new THREE.MeshStandardMaterial({color:0x151515}));w.rotation.z=Math.PI/2;w.position.set(x,.38,z);w.castShadow=true;car.add(w)}
car.position.set(0,.05,8);scene.add(car);
// Ball with subtle panel lines.
const ball=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:.3,metalness:.08}));ball.position.set(0,1,0);ball.castShadow=true;scene.add(ball);
const keys={jump:false};let ax=0,ay=0,stickActive=false,stickPointer=null;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.36;let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>max){dx*=max/l;dy*=max/l}ax=dx/max;ay=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;stickActive=true}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)setStick(e)});function endStick(e){if(e.pointerId!==stickPointer)return;ax=0;ay=0;stickPointer=null;knob.style.transform='translate(0,0)';stickActive=false}stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
const jump=document.getElementById('jump');jump.addEventListener('pointerdown',e=>{e.preventDefault();keys.jump=true});['pointerup','pointercancel','pointerleave'].forEach(t=>jump.addEventListener(t,e=>{e.preventDefault();keys.jump=false}));
addEventListener('keydown',e=>{if(e.code==='Space')keys.jump=true});addEventListener('keyup',e=>{if(e.code==='Space')keys.jump=false});
let speed=0,vy=0,scoreR=0,scoreG=0,goalLock=false;const ballV=new THREE.Vector3();
function updateScore(){document.querySelector('.teamR').textContent=scoreR;document.querySelector('.teamG').textContent=scoreG}
function reset(){car.position.set(0,.05,8);car.rotation.set(0,0,0);speed=0;vy=0;ball.position.set(0,1,0);ballV.set(0,0,0);goalLock=false}
document.getElementById('reset').onclick=()=>{scoreR=0;scoreG=0;updateScore();reset()};
function goalScored(team){if(goalLock)return;goalLock=true;if(team==='red')scoreR++;else scoreG++;updateScore();setTimeout(reset,650)}
function update(dt){
 const throttle=-ay,steer=ax,accel=14; if(Math.abs(throttle)>.08)speed+=throttle*accel*dt;else speed*=Math.pow(.035,dt);speed=THREE.MathUtils.clamp(speed,-9,17);
 if(Math.abs(steer)>.08)car.rotation.y-=steer*2.5*dt*(speed>=0?1:-1);
 const dir=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));car.position.addScaledVector(dir,speed*dt);car.position.x=THREE.MathUtils.clamp(car.position.x,-20.5,20.5);car.position.z=THREE.MathUtils.clamp(car.position.z,-12.5,12.5);
 if(keys.jump&&car.position.y<=.06){vy=8.5;keys.jump=false}vy-=20*dt;car.position.y=Math.max(.05,car.position.y+vy*dt);if(car.position.y<=.051)vy=0;
 ballV.y-=18*dt;ball.position.addScaledVector(ballV,dt);if(ball.position.y<1){ball.position.y=1;if(ballV.y<0)ballV.y*=-.62}if(Math.abs(ball.position.x)>21){ball.position.x=Math.sign(ball.position.x)*21;ballV.x*=-.75}
 if(Math.abs(ball.position.z)>13.2){if(ball.position.z<-13.2)goalScored('green');else goalScored('red');ball.position.z=Math.sign(ball.position.z)*13.2;ballV.z*=-.2}
 ballV.multiplyScalar(Math.pow(.32,dt));
 const dx=ball.position.x-car.position.x,dz=ball.position.z-car.position.z,dist=Math.hypot(dx,dz);if(dist<2.25&&ball.position.y<2.7){const n=new THREE.Vector3(dx,0,dz).normalize();ballV.addScaledVector(n,Math.max(5,Math.abs(speed)+7)*dt*5);ball.position.x=car.position.x+n.x*2.3;ball.position.z=car.position.z+n.z*2.3}
 camera.position.lerp(new THREE.Vector3(car.position.x-Math.sin(car.rotation.y)*9,car.position.y+5.6,car.position.z-Math.cos(car.rotation.y)*9),.1);camera.lookAt(car.position.x,car.position.y+1,car.position.z+2);
}
let last=performance.now();function loop(t){const dt=Math.min((t-last)/1000,.033);last=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});reset();loop(performance.now());
</script></body></html>
