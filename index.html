<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox Arabic World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        body {
            overflow: hidden;
            background-color: #0f172a;
        }

        /* اسم اللاعب والخطوات */
        #player-nametag {
            position: absolute;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            transform: translate(-50%, -100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        #steps-badge {
            background: #0284c7;
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 2px;
        }

        #admin-status {
            display: none;
            background: #e11d48;
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 2px;
            font-weight: bold;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        /* شريط المستوى */
        #ui-bottom-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #level-text {
            color: #fbbf24;
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
        }

        #progress-bg {
            flex-grow: 1;
            height: 12px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        #percentage-text {
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* عناصر التحكم باللمس */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: absolute;
        }

        #jump-btn {
            position: absolute;
            bottom: 40px;
            right: 30px;
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #jump-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.92);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="player-nametag">
        <span>dabbur</span>
        <div id="steps-badge"><span id="step-count">0</span> نقاط</div>
        <div id="admin-status">🔥 VIP x120 🔥</div>
    </div>

    <div id="ui-bottom-bar">
        <div id="level-text">Lv <span id="lvl-num">1</span></div>
        <div id="progress-bg">
            <div id="progress-fill"></div>
        </div>
        <div id="percentage-text"><span id="curr-pts">0</span>/<span id="req-pts">10</span></div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>
    <div id="jump-btn">قفز</div>

    <script>
        function initGame() {
            if (typeof THREE === 'undefined') {
                setTimeout(initGame, 10);
                return;
            }

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // إعدادات الأرضية
            const mapSize = 8;
            const keySize = 1.6;
            const spacing = 0.4;
            const boundSize = (mapSize + 1) * (keySize + spacing);
            const wallThickness = 1;
            const wallHeight = 8;

            const arabicLetters = ["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د","ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط","ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ"];
            const colors = [0x00b4d8, 0xe91e63, 0x9c27b0, 0x4caf50, 0xff9800, 0x00bcd4];

            function createKeyTexture(text, bgColorHex) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = bgColorHex;
                ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 10;
                ctx.strokeRect(10, 10, 236, 236);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'Bold 120px Tahoma, Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }

            let idx = 0;
            for (let r = -mapSize; r <= mapSize; r++) {
                for (let c = -mapSize; c <= mapSize; c++) {
                    const char = arabicLetters[idx % arabicLetters.length];
                    const colHex = '#' + colors[idx % colors.length].toString(16).padStart(6, '0');
                    const tex = createKeyTexture(char, colHex);
                    
                    const matSide = new THREE.MeshStandardMaterial({ color: 0x334155 });
                    const matTop = new THREE.MeshStandardMaterial({ map: tex });
                    const mats = [matSide, matSide, matTop, matSide, matSide, matSide];

                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(keySize, 0.4, keySize), mats);
                    mesh.position.set(c * (keySize + spacing), 0.2, r * (keySize + spacing));
                    scene.add(mesh);
                    idx++;
                }
            }

            // الجدران الصلبة
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(boundSize * 2, wallHeight, wallThickness), wallMat);
            backWall.position.set(0, wallHeight / 2, -boundSize);
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(boundSize * 2, wallHeight, wallThickness), wallMat);
            frontWall.position.set(0, wallHeight / 2, boundSize);
            scene.add(frontWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, boundSize * 2), wallMat);
            leftWall.position.set(-boundSize, wallHeight / 2, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, boundSize * 2), wallMat);
            rightWall.position.set(boundSize, wallHeight / 2, 0);
            scene.add(rightWall);

            // اسم المطور
            const canvasSign = document.createElement('canvas');
            canvasSign.width = 1024;
            canvasSign.height = 256;
            const ctxSign = canvasSign.getContext('2d');
            ctxSign.fillStyle = '#1e293b';
            ctxSign.fillRect(0, 0, 1024, 256);
            ctxSign.fillStyle = '#fbbf24';
            ctxSign.font = 'Bold 50px Tahoma, Arial';
            ctxSign.textAlign = 'center';
            ctxSign.textBaseline = 'middle';
            ctxSign.fillText('اللعبة مطورة من طه فوزي', 512, 128);
            
            const signTex = new THREE.CanvasTexture(canvasSign);
            const signMesh = new THREE.Mesh(new THREE.PlaneGeometry(16, 4), new THREE.MeshBasicMaterial({ map: signTex }));
            signMesh.position.set(0, 4.5, -boundSize + 0.6);
            scene.add(signMesh);

            // بناء سرير الأدمن باللون الأحمر
            const bedGroup = new THREE.Group();
            
            // قاعدة السرير الخشبية
            const bedBase = new THREE.Mesh(new THREE.BoxGeometry(4, 0.6, 6), new THREE.MeshStandardMaterial({ color: 0x854d0e }));
            bedBase.position.y = 0.3;
            bedGroup.add(bedBase);

            // المفرش باللون الأحمر للأدمن
            const bedMattress = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.4, 5.6), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
            bedMattress.position.y = 0.7;
            bedGroup.add(bedMattress);

            // الغطاء الأحمر
            const bedBlanket = new THREE.Mesh(new THREE.BoxGeometry(3.62, 0.42, 3.8), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
            bedBlanket.position.set(0, 0.71, 0.8);
            bedGroup.add(bedBlanket);

            // الوسادة البيضاء
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            pillow.position.set(0, 0.95, -1.8);
            bedGroup.add(pillow);

            // لافتة سرير الأدمن فوق السرير
            const canvasBedSign = document.createElement('canvas');
            canvasBedSign.width = 512;
            canvasBedSign.height = 128;
            const ctxBedSign = canvasBedSign.getContext('2d');
            ctxBedSign.fillStyle = '#dc2626';
            ctxBedSign.fillRect(0, 0, 512, 128);
            ctxBedSign.fillStyle = '#ffffff';
            ctxBedSign.font = 'Bold 40px Tahoma, Arial';
            ctxBedSign.textAlign = 'center';
            ctxBedSign.textBaseline = 'middle';
            ctxBedSign.fillText('👑 سرير الأدمن x120 👑', 256, 64);

            const bedSignTex = new THREE.CanvasTexture(canvasBedSign);
            const bedSignMesh = new THREE.Mesh(new THREE.PlaneGeometry(5, 1.25), new THREE.MeshBasicMaterial({ map: bedSignTex, side: THREE.DoubleSide }));
            bedSignMesh.position.set(0, 3.5, 0);
            bedGroup.add(bedSignMesh);

            // وضع السرير في زاوية الخريطة
            bedGroup.position.set(6, 0, 6);
            scene.add(bedGroup);

            // الشخصية بالأيدي والأرجل
            const playerGroup = new THREE.Group();
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
            head.position.y = 1.4;
            playerGroup.add(head);

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.0, 0.5), new THREE.MeshStandardMaterial({ color: 0x111827 }));
            body.position.y = 0.5;
            playerGroup.add(body);

            const limbGeo = new THREE.BoxGeometry(0.38, 0.9, 0.38);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const legMat = new THREE.MeshStandardMaterial({ color: 0x2563eb });

            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-0.65, 0.9, 0);
            const leftArm = new THREE.Mesh(limbGeo, armMat); leftArm.position.y = -0.45;
            leftArmGroup.add(leftArm); playerGroup.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(0.65, 0.9, 0);
            const rightArm = new THREE.Mesh(limbGeo, armMat); rightArm.position.y = -0.45;
            rightArmGroup.add(rightArm); playerGroup.add(rightArmGroup);

            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.25, 0.0, 0);
            const leftLeg = new THREE.Mesh(limbGeo, legMat); leftLeg.position.y = -0.45;
            leftLegGroup.add(leftLeg); playerGroup.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.25, 0.0, 0);
            const rightLeg = new THREE.Mesh(limbGeo, legMat); rightLeg.position.y = -0.45;
            rightLegGroup.add(rightLeg); playerGroup.add(rightLegGroup);

            playerGroup.position.set(0, 0.9, 0);
            scene.add(playerGroup);

            // متغيرات التحكم
            let level = 1, points = 0, ptsLvl = 0, reqPts = 10, speed = 0.08;
            let moveX = 0, moveZ = 0, velY = 0, isGrounded = true;
            let cameraYaw = 0, cameraPitch = 0.5, camDist = 8;
            let camTouchId = null, lastX = 0, lastY = 0;
            let walkAnimTime = 0;

            const joystickZone = document.getElementById('joystick-zone');
            const joystickStick = document.getElementById('joystick-stick');
            const jumpBtn = document.getElementById('jump-btn');
            const adminStatusEl = document.getElementById('admin-status');
            let joyActive = false, joyTouchId = null;

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    const rect = joystickZone.getBoundingClientRect();
                    if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                        joyTouchId = t.identifier;
                        joyActive = true;
                    } else if (t.target !== jumpBtn && camTouchId === null) {
                        camTouchId = t.identifier;
                        lastX = t.clientX;
                        lastY = t.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === joyTouchId && joyActive) {
                        const rect = joystickZone.getBoundingClientRect();
                        let dx = t.clientX - (rect.left + rect.width / 2);
                        let dy = t.clientY - (rect.top + rect.height / 2);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
                        joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                        moveX = dx / 35;
                        moveZ = dy / 35;
                    } else if (t.identifier === camTouchId) {
                        cameraYaw -= (t.clientX - lastX) * 0.008;
                        cameraPitch += (t.clientY - lastY) * 0.008;
                        cameraPitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraPitch));
                        lastX = t.clientX;
                        lastY = t.clientY;
                    }
                }
            });

            const resetTouches = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === joyTouchId) {
                        joyActive = false; joyTouchId = null; moveX = 0; moveZ = 0;
                        joystickStick.style.transform = `translate(0px, 0px)`;
                    }
                    if (t.identifier === camTouchId) camTouchId = null;
                }
            };

            window.addEventListener('touchend', resetTouches);
            window.addEventListener('touchcancel', resetTouches);

            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGrounded) { velY = 0.22; isGrounded = false; }
            });

            const nametagEl = document.getElementById('player-nametag');
            function updateNametagPosition() {
                const tempV = new THREE.Vector3();
                playerGroup.getWorldPosition(tempV);
                tempV.y += 2.2;
                tempV.project(camera);
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;
                nametagEl.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
            }

            function animate() {
                requestAnimationFrame(animate);

                const isMoving = Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1;

                // التحقق من الوقوف على سرير الأدمن
                const dxBed = Math.abs(playerGroup.position.x - bedGroup.position.x);
                const dzBed = Math.abs(playerGroup.position.z - bedGroup.position.z);
                const isOnAdminBed = (dxBed < 2.0 && dzBed < 3.0);

                const groundY = isOnAdminBed ? 1.8 : 0.9;

                if (isOnAdminBed) {
                    adminStatusEl.style.display = 'block';
                } else {
                    adminStatusEl.style.display = 'none';
                }

                if (isMoving) {
                    const fX = -Math.sin(cameraYaw), fZ = -Math.cos(cameraYaw);
                    const rX = Math.cos(cameraYaw), rZ = -Math.sin(cameraYaw);
                    const dirX = fX * (-moveZ) + rX * moveX;
                    const dirZ = fZ * (-moveZ) + rZ * moveX;

                    let nextX = playerGroup.position.x + dirX * speed;
                    let nextZ = playerGroup.position.z + dirZ * speed;

                    const playerRadius = 0.6;
                    const maxBound = boundSize - (wallThickness / 2) - playerRadius;

                    if (nextX > maxBound) nextX = maxBound;
                    if (nextX < -maxBound) nextX = -maxBound;
                    if (nextZ > maxBound) nextZ = maxBound;
                    if (nextZ < -maxBound) nextZ =
