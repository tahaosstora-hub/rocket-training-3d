<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Keyboard Obby Arabic</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e2e7;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:5;background:#25204b;color:white;border:3px solid #f0a9ff;border-radius:24px;padding:6px 22px;font-size:20px;font-weight:800;box-shadow:0 4px 12px #0005}
#level{position:fixed;bottom:14px;left:3%;right:3%;height:34px;border-radius:22px;background:#28204c;border:3px solid #fff;color:#fff;z-index:5;overflow:hidden;display:flex;align-items:center}
#fill{height:100%;width:66%;background:linear-gradient(90deg,#7d4cff,#41c9ef);border-radius:20px}
#lv{position:absolute;left:12px;font-weight:900}
#pct{position:absolute;right:12px;font-weight:900}
#joy{position:fixed;left:22px;bottom:65px;width:130px;height:130px;border-radius:50%;background:#ffffff24;border:3px solid #ffffff66;z-index:8;display:none}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#ffffffaa;border:3px solid #fff}
#jump{position:fixed;right:25px;bottom:70px;width:86px;height:86px;border:0;border-radius:50%;background:#6b55e8;color:#fff;font-weight:900;font-size:17px;z-index:8;display:none}
@media(pointer:coarse){#joy,#jump{display:block}}
</style>
</head>
<body>
<div id="top">⌨️ ساحة الكيبورد</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">قفز</button>
<div id="level"><div id="fill"></div><span id="lv">Lv 3</span><span id="pct">66%</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcbd5da);
scene.fog=new THREE.Fog(0xcbd5da,35,125);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x59636d,2.5));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-20,40,25);sun.castShadow=true;scene.add(sun);

// أرضية الساحة
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(110,150),
 new THREE.MeshStandardMaterial({color:0xbfc8cc,roughness:.9})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// مبنى/جدران الخلفية مثل الصورة
for(let x=-42;x<=42;x+=18){
 const col=new THREE.Mesh(new THREE.BoxGeometry(5,20,5),new THREE.MeshStandardMaterial({color:0xd9d9d4}));
 col.position.set(x,10,-48);scene.add(col);
}
const back=new THREE.Mesh(new THREE.BoxGeometry(100,16,2),new THREE.MeshStandardMaterial({color:0xe6e3dc}));
back.position.set(0,8,-49);scene.add(back);
for(let x=-48;x<=48;x+=16){
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(12,1.3,.5),new THREE.MeshStandardMaterial({color:0x29c9e8,emissive:0x0b5364,emissiveIntensity:.5}));
 stripe.position.set(x,11,-47.8);scene.add(stripe);
 const pink=new THREE.Mesh(new THREE.BoxGeometry(11,4,.6),new THREE.MeshStandardMaterial({color:0xc42a82}));
 pink.position.set(x,4,-47.6);scene.add(pink);
}

// زر كيبورد عربي: كبير، مرتفع، مستدير قليلا
const chars="ضصثقفغعهخحجدشسيبلاتنمكطئءؤرلاىةوزظ";
const palette=[0x22b7c7,0x4e8de8,0xf0b52b,0xe78434,0xd858a8,0x8a65d6,0x7b5637,0xe7e7e7];

function makeKey(label,x,z,scale=1){
 const group=new THREE.Group();
 const color=palette[Math.floor(Math.random()*palette.length)];
 const base=new THREE.Mesh(
   new THREE.BoxGeometry(2.7*scale,.85,2.25*scale),
   new THREE.MeshStandardMaterial({color,roughness:.48})
 );
 base.position.y=.43;base.castShadow=true;base.receiveShadow=true;
 group.add(base);

 const bevel=new THREE.Mesh(
   new THREE.BoxGeometry(2.45*scale,.10,2.02*scale),
   new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6})
 );
 bevel.position.y=.88;group.add(bevel);

 const c=document.createElement("canvas");c.width=256;c.height=256;
 const ctx=c.getContext("2d");
 ctx.fillStyle="rgba(255,255,255,0)";
 ctx.fillRect(0,0,256,256);
 ctx.fillStyle="#111";
 ctx.font=(label.length>2?"bold 38px":"bold 78px")+" Arial";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(label,128,132);
 const tex=new THREE.CanvasTexture(c);
 const face=new THREE.Mesh(new THREE.PlaneGeometry(2.15*scale,1.78*scale),
   new THREE.MeshBasicMaterial({map:tex,transparent:true}));
 face.rotation.x=-Math.PI/2;face.position.y=.95;group.add(face);

 group.position.set(x,0,z);
 scene.add(group);
}

// صفوف طويلة جدا مثل الصورة: مفاتيح متراصة مع ممرات
const rows=19, cols=15, gapX=3.0, gapZ=2.75;
for(let r=0;r<rows;r++){
 for(let c=0;c<cols;c++){
   const x=(c-(cols-1)/2)*gapX + (r%2?1.5:0);
   const z=28-r*gapZ;
   makeKey(chars[(r*cols+c)%chars.length],x,z,1);
 }
}

// أعمدة جانبية إضافية لتعبئة المشهد
for(let r=0;r<17;r++){
 makeKey(chars[(r+7)%chars.length],-31,28-r*3,1.05);
 makeKey(chars[(r+14)%chars.length],31,28-r*3,1.05);
}

// اللاعب
const player=new THREE.Group();
const torso=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.45,0.7),new THREE.MeshStandardMaterial({color:0x101827}));
torso.position.y=2.05;torso.castShadow=true;player.add(torso);
const shirt=new THREE.Mesh(new THREE.BoxGeometry(.52,.95,.73),new THREE.MeshStandardMaterial({color:0x1686df}));
shirt.position.set(0,2.05,.37);player.add(shirt);
const head=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.05,1.05),new THREE.MeshStandardMaterial({color:0xb9682a}));
head.position.y=3.35;head.castShadow=true;player.add(head);
const face=new THREE.Mesh(new THREE.PlaneGeometry(.65,.42),new THREE.MeshBasicMaterial({color:0xffffff}));
face.position.set(0,3.35,.54);player.add(face);
const leg1=new THREE.Mesh(new THREE.BoxGeometry(.52,1.25,.55),new THREE.MeshStandardMaterial({color:0x111827}));
const leg2=leg1.clone();leg1.position.set(-.34,.7,0);leg2.position.set(.34,.7,0);player.add(leg1,leg2);
const arm1=new THREE.Mesh(new THREE.BoxGeometry(.5,1.35,.55),new THREE.MeshStandardMaterial({color:0x101827}));
const arm2=arm1.clone();arm1.position.set(-.9,2,0);arm2.position.set(.9,2,0);player.add(arm1,arm2);
player.position.set(0,0,29);
scene.add(player);

// تحكم
const keys={};let joyX=0,joyY=0,vy=0,onGround=true;
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")jump()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function jump(){if(onGround){vy=9.5;onGround=false}}

const joy=document.getElementById("joy"),knob=document.getElementById("knob");
function moveJoy(e){
 const t=e.touches[0],r=joy.getBoundingClientRect();
 let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),m=37,d=Math.hypot(x,y);
 if(d>m){x=x/d*m;y=y/d*m}
 joyX=x/m;joyY=y/m;
 knob.style.transform=`translate(${x}px,${y}px)`;
}
joy.addEventListener("touchstart",e=>{moveJoy(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchmove",e=>{moveJoy(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchend",()=>{joyX=joyY=0;knob.style.transform="translate(0,0)"});
document.getElementById("jump").addEventListener("touchstart",e=>{jump();e.preventDefault()},{passive:false});
document.getElementById("jump").addEventListener("click",jump);

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 let x=joyX,z=joyY;
 if(keys.w||keys.arrowup)z-=1;
 if(keys.s||keys.arrowdown)z+=1;
 if(keys.a||keys.arrowleft)x-=1;
 if(keys.d||keys.arrowright)x+=1;
 const d=Math.hypot(x,z);
 if(d){x/=d;z/=d;player.position.x+=x*8*dt;player.position.z+=z*8*dt}
 vy-=23*dt;player.position.y+=vy*dt;
 if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 player.position.x=Math.max(-34,Math.min(34,player.position.x));
 player.position.z=Math.max(-43,Math.min(30,player.position.z));

 // كاميرا خلف اللاعب بزاوية قريبة من صورة Roblox
 const target=new THREE.Vector3(player.position.x,6.5,player.position.z+8.5);
 camera.position.lerp(target,.11);
 camera.lookAt(player.position.x,2.2,player.position.z-4);

 renderer.render(scene,camera);
}
animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
