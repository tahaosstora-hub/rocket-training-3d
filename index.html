<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#071018">
  <title>ROCKET TRAINING 3D</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="game"></div>

  <!-- Top HUD -->
  <header class="topbar">
    <div class="brand">
      <div class="title">ROCKET TRAINING 3D</div>
      <div class="subtitle">Training — تدريب</div>
    </div>

    <div class="score">
      <span class="red">0</span>
      <b>5:00</b>
      <span class="green">0</span>
    </div>

    <button class="settings" aria-label="Settings">⚙</button>
  </header>

  <!-- Mobile controls -->
  <div class="controls">

    <div id="joystick" class="joystick">
      <div class="arrow up">▲</div>
      <div class="arrow down">▼</div>
      <div class="arrow left">◀</div>
      <div class="arrow right">▶</div>
      <div id="stick" class="stick"></div>
    </div>

    <button id="jump" class="jump">
      <span>⬆</span>
      <strong>JUMP</strong>
    </button>

    <button id="reset" class="reset">
      ↻ &nbsp; RESET
    </button>

  </div>

  <!-- Three.js game -->
  <script type="module" src="game.js"></script>
</body>
</html>
