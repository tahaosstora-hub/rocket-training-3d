<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ساحة انتظار الكيبورد</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#182230;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#info{position:fixed;top:12px;right:12px;z-index:9;color:#fff;background:#0b1220dd;border:1px solid #ffffff22;border-radius:14px;padding:9px 13px;font-size:15px;line-height:1.5}
#joystick{position:fixed;left:22px;bottom:24px;width:132px;height:132px;border-radius:50%;background:#ffffff1b;border:2px solid #ffffff55;z-index:10;display:none;touch-action:none}
#stick{position:absolute;width:62px;height:62px;left:35px;top:35px;border-radius:50%;background:#22c55e;border:3px solid #fff9;box-sizing:border-box}
#jump{position:fixed;right:25px;bottom:35px;width:86px;height:86px;border:0;border-radius:50%;z-index:10;background:#3b82f6;color:#fff;font-size:18px;font-weight:bold;display:none;box-shadow:0 6px 18px #0008}
@media(pointer:coarse){#joystick,#jump{display:block}}
</style>
</head>
<body>
<div id="info">⌨️ ساحة الانتظار<br><small>حرّك بالأنالوج واقفز</small></div>
<div id="joystick"><div id="stick"></div></div>
<button id="jump">قفز</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x182230);
scene.fog=new THREE.Fog(0x182230,35,115);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff,0x263241,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(20,35,15);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x3b4754,roughness:.92}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const border=new THREE.Mesh(new THREE.CylinderGeometry(36,36,0.8,64),new THREE.MeshStandardMaterial({color:0x596775,roughness:.8}));
border.position.y=.4;scene.add(border);

const keys=[
["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د"],
["ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط",""],
["ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ",""],
["١","٢","٣","٤","٥","٦","٧","٨","٩","٠",""],
["Tab","Caps","Shift","Space","Enter","Back"]
];

function makeKey(label,x,z,s=1){
 const g=new THREE.Group();
 const col=new THREE.Color().setHSL((Math.abs(x*7+z*3)%360)/360,.65,.48);
 const base=new THREE.Mesh(new THREE.BoxGeometry(2.15*s,.62,1.75*s),
   new THREE.MeshStandardMaterial({color:col,roughness:.35,metalness:.08}));
 base.position.y=2;g.add(base);
 const c=document.createElement("canvas");c.width=256;c.height=160;
 const q=c.getContext("2d");q.clearRect(0,0,256,160);
 q.fillStyle="#fff";q.font=(label.length>3?"bold 34px":"bold 72px")+" Arial";
 q.textAlign="center";q.textBaseline="middle";q.fillText(label,128,82);
 const tex=new THREE.CanvasTexture(c);
 const top=new THREE.Mesh(new THREE.PlaneGeometry(1.8*s,1.4*s),
   new THREE.MeshBasicMaterial({map:tex,transparent:true}));
 top.rotation.x=-Math.PI/2;top.position.y=2.33;g.add(top);
 g.position.set(x,0,z);scene.add(g);
}

for(let r=0;r<keys.length;r++){
 const row=keys[r], gap=2.45, z=(r-2)*3.0;
 row.forEach((v,i)=>{if(v)makeKey(v,(i-(row.length-1)/2)*gap,z);});
}

// تغطية الساحة كاملة بأزرار إضافية
const letters="ضصثقفغعهخحجدشسيبلاتنمكطئءؤرلاىةوزظ";
for(let i=0;i<105;i++){
 const x=-30+(i%15)*4.2;
 const z=-29+Math.floor(i/15)*8.0;
 const off=(Math.floor(i/15)%2)*2.1;
 makeKey(letters[i%letters.length],x+off,z,.78);
}

// الشخصية
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.58,1.05,6,12),new THREE.MeshStandardMaterial({color:0x2563eb}));
body.position.y=1.25;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),new THREE.MeshStandardMaterial({color:0xf0bd99}));
head.position.y=2.25;player.add(head);
player.position.set(0,0,25);scene.add(player);

const state={x:0,y:0,jumping:false};
const pressed={};
let jx=0,jy=0;
addEventListener("keydown",e=>{
 pressed[e.key.toLowerCase()]=true;
 if(e.code==="Space")doJump();
});
addEventListener("keyup",e=>pressed[e.key.toLowerCase()]=false);

function doJump(){if(!state.jumping){state.y=9;state.jumping=true}}

const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
function setJoy(e){
 const t=e.touches[0],r=joy.getBoundingClientRect();
 let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),m=36,d=Math.hypot(x,y);
 if(d>m){x=x/d*m;y=y/d*m}
 jx=x/m;jy=y/m;stick.style.transform='translate('+x+'px,'+y+'px)';
}
joy.addEventListener("touchstart",e=>{setJoy(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchmove",e=>{setJoy(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchend",()=>{jx=jy=0;stick.style.transform="translate(0,0)"});
document.getElementById("jump").addEventListener("touchstart",e=>{doJump();e.preventDefault()},{passive:false});
document.getElementById("jump").addEventListener("click",doJump);

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.04,(now-last)/1000);last=now;
 let x=jx,z=jy;
 if(pressed.w||pressed.arrowup)z-=1;
 if(pressed.s||pressed.arrowdown)z+=1;
 if(pressed.a||pressed.arrowleft)x-=1;
 if(pressed.d||pressed.arrowright)x+=1;
 const d=Math.hypot(x,z);
 if(d){x/=d;z/=d;player.position.x+=x*8.5*dt;player.position.z+=z*8.5*dt}
 state.y-=22*dt;player.position.y+=state.y*dt;
 if(player.position.y<=0){player.position.y=0;state.y=0;state.jumping=false}
 player.position.x=Math.max(-33,Math.min(33,player.position.x));
 player.position.z=Math.max(-33,Math.min(33,player.position.z));
 const target=new THREE.Vector3(player.position.x,5.8,player.position.z+8);
 camera.position.lerp(target,.12);
 camera.lookAt(player.position.x,1.5,player.position.z-3);
 renderer.render(scene,camera);
}
animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
