<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ساحة انتظار الكيبورد العربية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;right:12px;z-index:4;color:#fff;background:#111827dd;padding:10px 14px;border-radius:14px;font-size:15px}
#joy{position:fixed;left:24px;bottom:25px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff1c;z-index:5;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#22c55e;border:3px solid #ffffffaa}
#jump{position:fixed;right:25px;bottom:35px;width:82px;height:82px;border:0;border-radius:50%;background:#3b82f6;color:#fff;font-weight:bold;font-size:17px;z-index:5;box-shadow:0 5px 15px #0008}
@media(pointer:fine){#joy,#jump{display:none}}
</style>
</head>
<body>
<div id="hud">⌨️ ساحة انتظار عربية<br><small>WASD / الأسهم — Space للقفز</small></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">قفز</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101827);
scene.fog=new THREE.Fog(0x101827,30,105);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdbeafe,0x243044,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(20,35,15);scene.add(sun);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0x334155,roughness:.9})
);
floor.rotation.x=-Math.PI/2;scene.add(floor);

const platform=new THREE.Mesh(
 new THREE.CylinderGeometry(31,31,1,64),
 new THREE.MeshStandardMaterial({color:0x475569,roughness:.7})
);
platform.position.y=.5;scene.add(platform);

const arabic=[
["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج"],
["ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط"],
["ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ"],
["١","٢","٣","٤","٥","٦","٧","٨","٩","٠"],
["Tab","Caps","Shift","Space","Enter","Back"]
];

function keyButton(text,x,z,scale=1){
 const g=new THREE.Group();
 const base=new THREE.Mesh(
  new THREE.BoxGeometry(2.05*scale,.55,1.7*scale),
  new THREE.MeshStandardMaterial({
   color:new THREE.Color().setHSL(Math.random()*.9,.7,.52),
   roughness:.35,metalness:.1
  })
 );
 g.add(base);
 const c=document.createElement("canvas");c.width=256;c.height=256;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#fff";ctx.font="bold 76px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(text,128,132);
 const tex=new THREE.CanvasTexture(c);
 const face=new THREE.Mesh(
  new THREE.PlaneGeometry(1.65*scale,1.35*scale),
  new THREE.MeshBasicMaterial({map:tex,transparent:true})
 );
 face.rotation.x=-Math.PI/2;face.position.y=.31;g.add(face);
 g.position.set(x,2,z);
 scene.add(g);
}

for(let r=0;r<arabic.length;r++){
 const row=arabic[r], spacing=2.35;
 for(let i=0;i<row.length;i++){
  keyButton(row[i],(i-(row.length-1)/2)*spacing,(r-1.5)*2.8);
 }
}

/* أزرار إضافية تملأ الساحة */
const extra=["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];
for(let i=0;i<70;i++){
 const a=i*.73,rad=10+(i%5)*3.1;
 keyButton(extra[i%extra.length],Math.cos(a)*rad,Math.sin(a)*rad,.8);
}

const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.1,6,12),new THREE.MeshStandardMaterial({color:0x2563eb}));
body.position.y=1.2;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),new THREE.MeshStandardMaterial({color:0xf2c09b}));
head.position.y=2.2;player.add(head);
player.position.set(0,0,20);scene.add(player);

const pressed={};let joyX=0,joyY=0,vy=0,onGround=true;
addEventListener("keydown",e=>{pressed[e.key.toLowerCase()]=true;if(e.code==="Space")jump()});
addEventListener("keyup",e=>pressed[e.key.toLowerCase()]=false);

function jump(){if(onGround){vy=8.5;onGround=false}}

const joy=document.getElementById("joy"),knob=document.getElementById("knob");
let touching=false;
function joyMove(e){
 const p=e.touches?e.touches[0]:e,r=joy.getBoundingClientRect();
 let x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2);
 const max=34,d=Math.hypot(x,y);
 if(d>max){x=x/d*max;y=y/d*max}
 knob.style.transform=`translate(${x}px,${y}px)`;
 joyX=x/max;joyY=y/max;
}
joy.addEventListener("touchstart",e=>{touching=true;joyMove(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchmove",e=>{if(touching)joyMove(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchend",()=>{touching=false;joyX=joyY=0;knob.style.transform="translate(0,0)"});
document.getElementById("jump").addEventListener("touchstart",e=>{jump();e.preventDefault()},{passive:false});
document.getElementById("jump").addEventListener("click",jump);

let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.04);last=now;
 let x=joyX,z=joyY;
 if(pressed.w||pressed.arrowup)z-=1;
 if(pressed.s||pressed.arrowdown)z+=1;
 if(pressed.a||pressed.arrowleft)x-=1;
 if(pressed.d||pressed.arrowright)x+=1;
 const l=Math.hypot(x,z);
 if(l){x/=l;z/=l;player.position.x+=x*8*dt;player.position.z+=z*8*dt}
 vy-=20*dt;player.position.y+=vy*dt;
 if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 player.position.x=Math.max(-29,Math.min(29,player.position.x));
 player.position.z=Math.max(-29,Math.min(29,player.position.z));
 const target=new THREE.Vector3(player.position.x,5.2,player.position.z+7);
 camera.position.lerp(target,.1);
 camera.lookAt(player.position.x,1.5,player.position.z-2);
 renderer.render(scene,camera);
}
loop(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
