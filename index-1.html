<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arabic Keyboard Obby</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfd5d8;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;right:12px;z-index:20;color:#fff;background:#111827e8;border:1px solid #ffffff30;border-radius:16px;padding:9px 14px;font-weight:800;line-height:1.35}
#progress{position:fixed;left:4%;right:4%;bottom:13px;height:31px;border-radius:18px;background:#24203fe8;border:2px solid #fff;z-index:20;overflow:hidden}
#bar{height:100%;width:35%;background:linear-gradient(90deg,#7445e8,#4dd7f2);border-radius:16px}
#lv{position:absolute;left:10px;top:4px;color:#fff;font-weight:900}
#pct{position:absolute;right:10px;top:4px;color:#fff;font-weight:900}
#joy{position:fixed;left:20px;bottom:60px;width:135px;height:135px;border:3px solid #ffffff77;border-radius:50%;background:#ffffff1c;z-index:30;display:none;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:65px;height:65px;border-radius:50%;background:#20c968;border:3px solid #fff;box-shadow:0 4px 10px #0005}
#jump{position:fixed;right:25px;bottom:68px;width:90px;height:90px;border:0;border-radius:50%;background:#367ff0;color:#fff;font-weight:900;font-size:18px;z-index:30;display:none;box-shadow:0 7px 18px #0006}
@media(pointer:coarse){#joy,#jump{display:block}}
</style>
</head>
<body>
<div id="hud">⌨️ ساحة الكيبورد<br><small>دوس على الزر باش يهبط</small></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">قفز</button>
<div id="progress"><div id="bar"></div><span id="lv">Lv 3</span><span id="pct">66%</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcbd2d6);
scene.fog=new THREE.Fog(0xcbd2d6,28,120);

const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x59636c,2.25));
const sun=new THREE.DirectionalLight(0xffffff,3.1);
sun.position.set(-25,45,22);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

/* أرضية منخفضة باش يكون بين الأزرار فراغ */
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,145),
 new THREE.MeshStandardMaterial({color:0x9fa9ae,roughness:.96})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-1.15;
ground.receiveShadow=true;
scene.add(ground);

/* خلفية */
const back=new THREE.Mesh(new THREE.BoxGeometry(105,22,2.2),new THREE.MeshStandardMaterial({color:0xe4e2dd,roughness:.85}));
back.position.set(0,10,-50);scene.add(back);
for(let x=-45;x<=45;x+=15){
 const pillar=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,24,28),new THREE.MeshStandardMaterial({color:0xb4b6b8,roughness:.8}));
 pillar.position.set(x,12,-48);scene.add(pillar);
}
for(let x=-45;x<=45;x+=15){
 const cyan=new THREE.Mesh(new THREE.BoxGeometry(10,.55,.5),new THREE.MeshStandardMaterial({color:0x40d8f2,emissive:0x126070,emissiveIntensity:.4}));
 cyan.position.set(x,16,-46.7);scene.add(cyan);
 const pink=new THREE.Mesh(new THREE.BoxGeometry(10,3.2,.5),new THREE.MeshStandardMaterial({color:0xc52b7b}));
 pink.position.set(x,5,-46.5);scene.add(pink);
}

/* أزرار كثيفة جدا مثل الصورة */
const letters=["ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","د","ش","س","ي","ب","ل","ا","ت","ن","م","ك","ط","ئ","ء","ؤ","ر","لا","ى","ة","و","ز","ظ"];
const palette=[0x22b7c5,0x3d83e7,0xe8cf38,0xef9745,0xd45aaa,0x79536b,0xe6e6e6,0x56b64d];
const keyData=[];

function makeKey(label,x,z,scale=.9){
 const g=new THREE.Group();
 const color=palette[Math.floor(Math.random()*palette.length)];

 const base=new THREE.Mesh(
   new THREE.BoxGeometry(2.7*scale,.72,2.35*scale),
   new THREE.MeshStandardMaterial({color,roughness:.45})
 );
 base.position.y=-.72;
 base.castShadow=true;base.receiveShadow=true;
 g.add(base);

 const top=new THREE.Mesh(
   new THREE.BoxGeometry(2.48*scale,.24,2.13*scale),
   new THREE.MeshStandardMaterial({color:new THREE.Color(color).offsetHSL(0,.01,.08),roughness:.38})
 );
 top.position.y=-.31;
 top.castShadow=true;
 g.add(top);

 const c=document.createElement("canvas");
 c.width=256;c.height=256;
 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,256,256);
 ctx.fillStyle="#111";
 ctx.font=(label.length>2?"bold 38px":"bold 76px")+" Arial";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(label,128,132);
 const tex=new THREE.CanvasTexture(c);
 const face=new THREE.Mesh(new THREE.PlaneGeometry(2.12*scale,1.78*scale),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
 face.rotation.x=-Math.PI/2;
 face.position.y=-.17;
 g.add(face);

 g.position.set(x,0,z);
 scene.add(g);

 keyData.push({g,top,face,base,home:-.31,pressed:-.72,vel:0,active:false,x,z});
}

/* شبكة قريبة بزاف: 19×34 */
const rows=34,cols=19;
for(let r=0;r<rows;r++){
 for(let c=0;c<cols;c++){
   const x=(c-(cols-1)/2)*2.72 + (r%2?1.36:0);
   const z=29-r*2.55;
   makeKey(letters[(r*cols+c)%letters.length],x,z,.91);
 }
}

/* شخصية Roblox-style: رأس + جسم + يدين + رجلين */
const player=new THREE.Group();

const torso=new THREE.Mesh(new THREE.BoxGeometry(1.45,1.7,.82),new THREE.MeshStandardMaterial({color:0x111827,roughness:.5}));
torso.position.y=1.65;torso.castShadow=true;player.add(torso);

const shirt=new THREE.Mesh(new THREE.BoxGeometry(.68,1.08,.86),new THREE.MeshStandardMaterial({color:0x1687df,roughness:.45}));
shirt.position.set(0,1.62,.43);player.add(shirt);

const head=new THREE.Mesh(new THREE.BoxGeometry(1.18,1.18,1.18),new THREE.MeshStandardMaterial({color:0xa96531,roughness:.65}));
head.position.y=3.08;head.castShadow=true;player.add(head);

/* الوجه */
const faceCanvas=document.createElement("canvas");faceCanvas.width=256;faceCanvas.height=180;
const fctx=faceCanvas.getContext("2d");
fctx.fillStyle="#fff";fctx.fillRect(0,0,256,180);
fctx.strokeStyle="#111";fctx.lineWidth=8;
fctx.beginPath();fctx.arc(128,105,32,0,Math.PI);fctx.stroke();
const faceTex=new THREE.CanvasTexture(faceCanvas);
const faceMesh=new THREE.Mesh(new THREE.PlaneGeometry(.78,.55),new THREE.MeshBasicMaterial({map:faceTex}));
faceMesh.position.set(0,3.08,.61);player.add(faceMesh);

function limb(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.55}));
 m.position.set(x,y,z);m.castShadow=true;return m;
}
const armL=limb(.55,1.5,.62,0x111827,-1.02,1.62,0);
const armR=limb(.55,1.5,.62,0x111827,1.02,1.62,0);
const handL=limb(.58,.45,.65,0xe9e9e9,-1.02,.72,0);
const handR=limb(.58,.45,.65,0xe9e9e9,1.02,.72,0);
const legL=limb(.58,1.35,.65,0x101827,-.38,.12,0);
const legR=limb(.58,1.35,.65,0x101827,.38,.12,0);
const footL=limb(.64,.42,.85,0x171717,-.38,-.76,-.08);
const footR=limb(.64,.42,.85,0x171717,.38,-.76,-.08);
player.add(armL,armR,handL,handR,legL,legR,footL,footR);
player.position.set(0,0,28);
scene.add(player);

/* التحكم */
const keys={};let joyX=0,joyY=0,vy=0,onGround=true;
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")jump()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function jump(){
 if(onGround){vy=10.2;onGround=false}
}

const joy=document.getElementById("joy"),knob=document.getElementById("knob");
function moveJoy(e){
 const t=e.touches[0],r=joy.getBoundingClientRect();
 let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),max=38,d=Math.hypot(x,y);
 if(d>max){x=x/d*max;y=y/d*max}
 joyX=x/max;joyY=y/max;
 knob.style.transform="translate("+x+"px,"+y+"px)";
}
joy.addEventListener("touchstart",e=>{moveJoy(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchmove",e=>{moveJoy(e);e.preventDefault()},{passive:false});
joy.addEventListener("touchend",()=>{joyX=joyY=0;knob.style.transform="translate(0,0)"});
document.getElementById("jump").addEventListener("touchstart",e=>{jump();e.preventDefault()},{passive:false});
document.getElementById("jump").addEventListener("click",jump);

/* الضغط الحقيقي للأزرار: أقرب زر تحت اللاعب يهبط */
function updateKeys(dt){
 for(const k of keyData){
   const dx=player.position.x-k.x,dz=player.position.z-k.z;
   const dist=Math.hypot(dx,dz);
   const hit=dist<1.32 && player.position.y<.65 && player.position.y>-.3;
   k.active=hit;
   const target=hit?k.pressed:k.home;
   k.vel+=(target-k.top.position.y)*55*dt;
   k.vel*=Math.pow(.001,dt);
   k.top.position.y+=k.vel*dt;
   k.face.position.y=k.top.position.y+.14;
   k.base.position.y=-.72;
 }
}

let last=performance.now(),stepCount=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.035);last=now;

 let x=joyX,z=joyY;
 if(keys.w||keys.arrowup)z-=1;
 if(keys.s||keys.arrowdown)z+=1;
 if(keys.a||keys.arrowleft)x-=1;
 if(keys.d||keys.arrowright)x+=1;

 const len=Math.hypot(x,z);
 if(len){
   x/=len;z/=len;
   player.position.x+=x*8.2*dt;
   player.position.z+=z*8.2*dt;
   player.rotation.y=Math.atan2(x,z);
   armL.rotation.x=Math.sin(now*.012)*.18;
   armR.rotation.x=-Math.sin(now*.012)*.18;
   legL.rotation.x=-Math.sin(now*.012)*.25;
   legR.rotation.x=Math.sin(now*.012)*.25;
 }

 /* الجاذبية */
 vy-=24*dt;
 player.position.y+=vy*dt;

 /* تحديد أعلى زر تحت اللاعب */
 let support=-1.15;
 for(const k of keyData){
   if(Math.hypot(player.position.x-k.x,player.position.z-k.z)<1.18){
     const h=k.top.position.y+0.12;
     if(h>support)support=h;
   }
 }
 if(player.position.y<=support){
   player.position.y=support;
   vy=0;onGround=true;
 }else if(player.position.y>support+.25){
   onGround=false;
 }

 /* السقوط يعاود من البداية */
 if(player.position.y<-6){
   player.position.set(0,0,28);
   vy=0;onGround=true;
 }

 player.position.x=Math.max(-27,Math.min(27,player.position.x));
 player.position.z=Math.max(-59,Math.min(30,player.position.z));

 updateKeys(dt);

 /* كاميرا ثالث شخص */
 const target=new THREE.Vector3(player.position.x,5.6,player.position.z+8.2);
 camera.position.lerp(target,.105);
 camera.lookAt(player.position.x,1.8,player.position.z-3.5);

 renderer.render(scene,camera);
}
animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
